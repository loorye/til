version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - env | grep -E '^(OPENAI_|GOOGLE_|AUTH_|MOCK_|NEXT_PUBLIC_|DISABLE_|BEDROCK_|GEMINI_)' >> .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
